name: Arch package

# Manual only: Actions tab -> "Arch package" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: main

jobs:
  pacman:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git sudo cargo

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # build.rs measures git distance from the release tag

      # Cargo downloads and compiled deps survive between runs; saved even when
      # the build fails, so a retry resumes instead of starting over.
      - name: Restore cargo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
            target
          key: arch-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            arch-${{ hashFiles('Cargo.lock') }}-
            arch-

      - name: Build package
        run: |
          useradd -M -d /home/builder builder # cache restore may already have created the home
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          git config --system --add safe.directory '*'
          mkdir /tmp/build "$GITHUB_WORKSPACE/out"
          mkdir -p /home/builder/.cargo
          chown -R builder /home/builder . /tmp/build "$GITHUB_WORKSPACE/out"
          cd packaging/arch
          # Keep makepkg's root-only pkg/ dir out of the tree: cargo scans the tree.
          sudo -u builder env BUILDDIR=/tmp/build PKGDEST="$GITHUB_WORKSPACE/out" \
            makepkg --syncdeps --noconfirm --force

      - name: Save cargo cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
            target
          key: arch-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: opencadstudio-pacman
          path: out/*.pkg.tar.zst
          if-no-files-found: error
